<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NYC Food">
  <meta name="description" content="A map of NYC restaurants for a food trip, with filters and live location.">
  <title>NYC Food Tour</title>
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header class="top">
    <div class="title-row">
      <h1>NYC Food Tour</h1>
      <p id="status" class="status"></p>
    </div>
    <label class="search">
      <span class="sr-only">Search restaurants, dishes, or neighborhoods</span>
      <input id="search" type="search" placeholder="Search name, dish, neighborhood" enterkeyhint="search" autocomplete="off">
    </label>
    <div id="filters" class="filters" role="tablist" aria-label="Cuisine filters"></div>
  </header>

  <div class="tools">
    <button id="locate" class="locate" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"></path></svg>
      <span>My location</span>
    </button>
    <p class="legend"><span class="legend-star" aria-hidden="true">★</span> Short list</p>
  </div>

  <section class="sheet" id="sheet" data-size="closed" aria-label="Restaurant list">
    <button id="handle" class="handle" type="button" aria-label="Resize the list"></button>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="restaurants.js"></script>
  <script src="app.js"></script>
</body>
</html>
